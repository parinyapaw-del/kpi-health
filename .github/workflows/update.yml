# อัปเดตข้อมูลอัตโนมัติ (web_spec_phase2.md §7)
# ทุกวัน 07:00 ICT (= 00:00 UTC): DSPM 8 จังหวัดเขต 4 + Coverage ทั้งประเทศ ของ currentYear และปีก่อนหน้า
#   (ปีเก่ากว่านั้นใช้ cache ที่ commit ไว้ ไม่ดึงซ้ำ) · วันจันทร์: + DSPM ทั้ง 77 จังหวัดของ currentYear (ระดับประเทศ/เขต)
# ผ่าน -> commit "data: auto-update <วันที่>" + push (Cloudflare Pages deploy เอง) · ล้ม/หมดเวลา -> ไม่ commit + เปิด/คอมเมนต์ GitHub Issue
#
# ปีงบใหม่ (spec §7.3, sites/angthong.json "autoYear": true):
#   1. ทุกรอบ kpi.py probe API หาปี max(years)+1 (ไม่แก้ config)
#   2. รอบรายวันที่พบข้อมูล DSPM ของปีใหม่ -> ไม่ดึงปีนั้น, เขียน pendingYears ใน pipeline_status.json
#      -> step "dispatch รอบระดับประเทศ" สั่ง workflow นี้ใหม่ด้วย national=true, year=<ปี> (ถ้ายังไม่มีรอบของปีนั้นค้างอยู่)
#   3. รอบระดับประเทศของปีนั้น: ดึง DSPM ทั้ง 77 จังหวัด + Coverage (0 แถว = เตือน) -> เมื่อมีสรุประดับประเทศแล้ว
#      จึงเพิ่มปีใน sites/angthong.json (currentYear = ปีใหม่, เป้าที่ยังไม่มี = คัดลอกจากปีก่อน) -> newYears -> Issue "พบข้อมูลปีงบ <ปี> — กรุณาตรวจ/แก้เป้าหมาย"
#      ดึงไม่สำเร็จ -> ล้ม (Issue) และ config ไม่เปลี่ยน
name: update-data
run-name: "update-data${{ inputs.year && format(' ปีงบ {0}', inputs.year) || '' }}${{ inputs.national && ' (national)' || '' }}"

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      national:
        description: "ดึง DSPM ทั้ง 77 จังหวัด (ระดับประเทศ/เขต) ด้วย — ปกติทำเองทุกวันจันทร์"
        type: boolean
        default: false
      year:
        description: "ดึงเฉพาะปีงบนี้ (พ.ศ. เช่น 2570) — ปีที่ยังไม่อยู่ใน config + national = เพิ่มปีใหม่เมื่อดึงสำเร็จ · เว้นว่าง = ตาม config"
        type: string
        default: ""

permissions:
  contents: write
  issues: write
  actions: write   # gh workflow run (dispatch รอบระดับประเทศของปีใหม่)

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      national: ${{ steps.p.outputs.national }}
      today: ${{ steps.p.outputs.today }}
    steps:
      - id: p
        run: |
          # วันจันทร์ (ICT) = รอบระดับประเทศ · หรือกดเลือกเอง
          DOW=$(TZ=Asia/Bangkok date +%u)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$DOW" = "1" ]; then N=true; else N=false; fi
          if [ "${{ inputs.national }}" = "true" ]; then N=true; fi
          echo "national=$N" >> "$GITHUB_OUTPUT"
          echo "today=$(TZ=Asia/Bangkok date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "national=$N dow=$DOW year=${{ inputs.year }}"

  update:
    needs: plan
    runs-on: ubuntu-latest
    # รอบระดับประเทศ ~85 นาทีต่อปี (+ ปีใหม่) · รอบรายวัน ~10 นาที
    timeout-minutes: ${{ needs.plan.outputs.national == 'true' && 150 || 40 }}
    env:
      GH_TOKEN: ${{ github.token }}
      TZ: Asia/Bangkok
      YEAR_INPUT: ${{ inputs.year }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: python3 -m pip install -r scripts/requirements.txt

      - name: kpi.py update
        id: run
        run: |
          set -o pipefail
          ARGS="update --site angthong --refresh"
          if [ "${{ needs.plan.outputs.national }}" = "true" ]; then ARGS="$ARGS --national"; fi
          if [ -n "$YEAR_INPUT" ]; then
            case "$YEAR_INPUT" in
              25[0-9][0-9]) ARGS="$ARGS --year $YEAR_INPUT" ;;
              *) echo "year ต้องเป็นปี พ.ศ. 4 หลัก (ได้ '$YEAR_INPUT')"; exit 1 ;;
            esac
          fi
          echo "python3 -u scripts/kpi.py $ARGS"
          python3 -u scripts/kpi.py $ARGS 2>&1 | tee update.log

      - name: commit + push (เมื่อมีข้อมูลใหม่)
        if: success()
        run: |
          git add -A data/cache data/lookup/units.json site/data sites/angthong.json
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: auto-update ${{ needs.plan.outputs.today }}${{ needs.plan.outputs.national == 'true' && ' (national)' || '' }}${{ inputs.year && format(' ปีงบ {0}', inputs.year) || '' }}"
            git push
          fi

      - name: dispatch รอบระดับประเทศของปีงบใหม่ (pendingYears)
        if: success()
        run: |
          YEARS=$(python3 -c "import json; s=json.load(open('data/cache/pipeline_status.json')); print(' '.join(str(y) for y in s.get('pendingYears') or []))" 2>/dev/null || true)
          for Y in $YEARS; do
            # รอบของปีนี้ที่ค้างอยู่ (queued / in_progress ฯลฯ ยกเว้นรอบนี้เอง) ดูจาก run-name "ปีงบ <ปี>"
            BUSY=$(gh run list --workflow update.yml --limit 30 --json databaseId,status,displayTitle \
              --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID) | select(.status != \"completed\") | select(.displayTitle | contains(\"ปีงบ $Y\"))] | length")
            if [ "${BUSY:-0}" != "0" ]; then
              echo "ปีงบ $Y: มีรอบระดับประเทศค้างอยู่แล้ว ($BUSY รอบ) - ไม่ dispatch ซ้ำ"
            else
              echo "ปีงบ $Y: พบข้อมูล DSPM -> dispatch update-data national=true year=$Y"
              gh workflow run update.yml --ref "${{ github.ref_name }}" -f national=true -f year="$Y"
            fi
          done

      - name: GitHub Issue (ปีงบใหม่ §7.3 / ล้มเหลว-หมดเวลา §7.1 Q39)
        if: always()
        run: |
          # pipeline_issue <state open|all> <คำค้นในชื่อ> <ชื่อ Issue> <เนื้อหา> <ถ้าพบแล้ว: comment|skip>
          # label "pipeline" + หา Issue เดิม -> ไม่พบ = สร้างใหม่ · พบ = คอมเมนต์ต่อ (comment) หรือไม่ทำอะไร (skip)
          pipeline_issue() {
            gh label create pipeline --color d73a4a --description "pipeline อัปเดตข้อมูลอัตโนมัติ" --force >/dev/null
            FOUND=$(gh issue list --state "$1" --label pipeline --search "\"$2\" in:title" --json number --jq '.[0].number')
            if [ -z "$FOUND" ]; then
              gh issue create --label pipeline --title "$3" --body "$4"
            elif [ "$5" = "comment" ]; then
              gh issue comment "$FOUND" --body "$(printf '%s\n\n%s' "$3" "$4")"
            else
              echo "มี Issue #$FOUND อยู่แล้ว: $3"
            fi
          }

          if [ "${{ job.status }}" = "success" ]; then
            # ปีงบใหม่ที่ถูกเพิ่มใน config รอบนี้ -> ปีละ 1 Issue (ค้นทั้งที่เปิด/ปิดแล้ว)
            YEARS=$(python3 -c "import json; s=json.load(open('data/cache/pipeline_status.json')); print(' '.join(str(y) for y in s.get('newYears') or []))" 2>/dev/null || true)
            for Y in $YEARS; do
              TITLE="พบข้อมูลปีงบ $Y — กรุณาตรวจ/แก้เป้าหมาย"
              TARGETS=$(python3 -c "import json; s=json.load(open('sites/angthong.json')); print(' · '.join(f\"{i} = {s['targets'][i]['$Y']['value']}\" + (f\" (คัดลอกจากปี {s['targets'][i]['$Y']['inheritedFrom']})\" if s['targets'][i]['$Y'].get('inheritedFrom') else '') for i in s['indicators'] if s['targets'].get(i,{}).get('$Y',{}).get('value') is not None)" 2>/dev/null || true)
              BODY=$(printf 'GitHub Actions พบข้อมูลปีงบ %s ใน MOPH Open Data API แล้ว (ดึง DSPM ทั้ง 77 จังหวัดสำเร็จ) และเพิ่มปีนี้ใน `sites/angthong.json` (currentYear = %s)\n\nเป้าหมายที่ใช้อยู่ตอนนี้: %s\n(ปีใหม่ที่ยังไม่มีเป้าจะใช้เป้าของปีก่อนหน้าไปก่อน — Save 2026-10-06)\n\nแก้เป้าหมายได้ 2 ทาง\n1. หน้า `/admin/` → เป้าหมายปี %s (ค่าใน KV ทับค่า repo)\n2. แก้ `sites/angthong.json` → `targets.dspm.%s.value` และ `targets.coverage.%s.value` แล้ว push\n\nปิด Issue นี้เมื่อตรวจเป้าหมายแล้ว' "$Y" "$Y" "${TARGETS:-ยังไม่กำหนด}" "$Y" "$Y" "$Y")
              pipeline_issue all "$TITLE" "$TITLE" "$BODY" skip
            done
          else
            # ล้มเหลว (failure) หรือถูกยกเลิก/หมดเวลา (cancelled) -> 1 Issue เปิดค้างไว้, รอบต่อไปคอมเมนต์ต่อ
            TITLE="อัปเดตข้อมูลล้มเหลว ${{ needs.plan.outputs.today }}"
            if [ "${{ job.status }}" = "cancelled" ]; then
              WHY="ถูกยกเลิก/หมดเวลา (timeout ${{ needs.plan.outputs.national == 'true' && 150 || 40 }} นาที)"
            else
              WHY="ล้มเหลว"
            fi
            LOG=$(tail -n 50 update.log 2>/dev/null || echo "(ไม่มี log)")
            BODY=$(printf 'Workflow run: %s/%s/actions/runs/%s (%s%s)\n\nข้อมูลบนเว็บยังเป็นชุดเดิม (ไม่ได้ commit)\n\n50 บรรทัดท้ายของ log:\n```\n%s\n```' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$WHY" "${YEAR_INPUT:+, ปีงบ $YEAR_INPUT}" "$LOG")
            pipeline_issue open "อัปเดตข้อมูลล้มเหลว" "$TITLE" "$BODY" comment
          fi
